# iii engine config for docx-audit
#
# 顶层只允许 `workers`（或 `modules`）一个 key。
# 端口在各 worker 的 config 块内设置；此处使用内置默认值：
#   - WebSocket 网关: 49134（workers/docx-audit 的 III_ENGINE_URL）
#   - HTTP:            3111
workers:
  - name: iii-http
  - name: iii-queue
    # 'iii-queue': value now lives in the configuration worker at ./config/iii-queue.yaml. Edit at runtime via 'iii config set iii-queue' (or 'configuration::set'); this block is no longer read.
  - name: iii-state
  - name: iii-observability
  - name: obs-demo
    worker_path: /home/robert/development/docx-audit-iii/workers/obs-demo
  - name: docx-audit
    worker_path: /home/robert/development/docx-audit-iii/workers/docx-audit
  - name: mineru-convert
    worker_path: /home/robert/development/docx-audit-iii/workers/mineru-convert
